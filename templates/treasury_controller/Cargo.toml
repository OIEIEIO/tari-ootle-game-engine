# Ootle Asset Game | templates/treasury_controller/Cargo.toml
# Purpose: standalone Ootle WASM template, built separately from Axum server.
# The root Cargo.toml controls the DASHBOARD version; keep this crate release in sync.
[package]
name = "ootle_treasury_controller"
version = "0.3.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
tari_template_lib = "0.40.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
# End of Cargo.toml
