# Ootle Asset Game | templates/game_session/Cargo.toml
# Standalone Ootle WASM template. Separate from the treasury contract.
[package]
name = "ootle_game_session"
version = "0.6.10"
edition = "2021"
publish = false
[lib]
crate-type = ["cdylib"]
[dependencies]
tari_template_lib = "0.40.1"
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
