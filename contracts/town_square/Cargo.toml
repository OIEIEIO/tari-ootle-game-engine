# Ootle Game Engine | contracts/town_square/Cargo.toml
# Version: v0.3.0
# Standalone Ootle WASM template crate (cdylib). Built with ./scripts/build-all.sh.
[package]
name = "ootle_town_square"
version = "0.3.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
tari_template_lib = "=0.40.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
# End of contracts/town_square/Cargo.toml
